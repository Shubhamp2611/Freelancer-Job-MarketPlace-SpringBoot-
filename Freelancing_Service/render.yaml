services:
  - type: web
    name: freelance-marketplace
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests -U
    startCommand: java -jar target/freelance-marketplace-api.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: production
