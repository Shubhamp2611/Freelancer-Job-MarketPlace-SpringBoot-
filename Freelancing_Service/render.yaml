services:
  - type: web
    name: freelance-marketplace
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/freelance-marketplace-api.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: APP_FILE_UPLOAD_DIR
        value: /tmp/uploads
      - key: PLATFORM_CURRENCY
        value: INR
      - key: PLATFORM_FEE_PERCENTAGE
        value: 10
      - key: STRIPE_PUBLIC_KEY
        value: pk_test_dummy
      - key: STRIPE_SECRET_KEY
        value: sk_test_dummy
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1