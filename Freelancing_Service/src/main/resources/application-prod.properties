# ========================
# SERVER
# ========================
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ========================
# DATABASE - POSTGRESQL (Neon)
# ========================
# Use environment variable DATABASE_URL from Neon
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool optimized for Neon serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.pool-name=Neon-Hikari-Pool

# Prepared statement caching
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ========================
# SECURITY / JWT
# ========================
# Production - use environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================
# CORS
# ========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://freelancer-frontend-hdt5efzut-shubhamp2611s-projects.vercel.app}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================
# ACTUATOR / MONITORING
# ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,mappings
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Metrics
management.metrics.tags.application=freelance-marketplace

# Application info
info.app.name=Freelance Marketplace API
info.app.description=Freelance Job Platform Backend
info.app.version=1.0.0
info.app.environment=production

# ========================
# RATE LIMITING
# ========================
rate-limiting.enabled=true
rate-limiting.auth-limit=5
rate-limiting.public-limit=50
rate-limiting.secure-limit=100
rate-limiting.time-duration-minutes=1

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.file.upload-dir=/tmp/uploads

# ========================
# LOGGING
# ========================
logging.level.com.marketplace=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.file.name=./logs/app.log
logging.file.max-size=50MB
logging.file.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================
# MISC
# ========================
spring.main.allow-bean-definition-overriding=false
spring.profiles.active=prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false