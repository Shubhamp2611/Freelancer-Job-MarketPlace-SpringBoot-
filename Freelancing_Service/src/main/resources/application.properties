# ===============================
# Application
# ===============================
spring.application.name=Freelance Marketplace

# ===============================
# Database Configuration (Supabase – Session Pooler)
# ===============================
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ilihhlyksmmteyseotbq
spring.datasource.password='?K6V/73&rYFFrT+'
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (important for pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000


# File Upload Directory (IMPORTANT for Render)
app.file.upload-dir=/tmp/uploads

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql

# Disable metadata lookup (important for Supabase)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Server
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ===============================
# Mail (Disabled)
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JWT
# ===============================
app.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
app.jwt.expiration-ms=86400000

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=https://freelancer-job-market-place-spring.vercel.app

# ===============================
# Logging
# ===============================
logging.level.com.marketplace=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# Allow bean override
spring.main.allow-bean-definition-overriding=true
