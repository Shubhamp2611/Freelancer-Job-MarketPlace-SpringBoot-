# ========================
# SERVER
# ========================
server.port=8080
server.servlet.session.timeout=30m

# ========================
# DATABASE - MySQL
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=zxcvbnm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================
# SECURITY / JWT
# ========================
app.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
app.jwt.expiration-ms=86400000

# ========================
# CORS
# ========================
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# ========================
# LOGGING
# ========================
logging.level.com.marketplace=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=./logs/app.log

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
# ========================

#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql
#spring.jpa.defer-datasource-initialization=true

# Disable SpringDoc OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# MISC
# ========================
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=dev