# ===============================
# Application
# ===============================
spring.application.name=Freelance Marketplace

# ===============================
# Database Configuration (Supabase – Session Pooler)
# ===============================
# ===============================
# Database Configuration (Supabase – Session Pooler)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}  # Use Render env variable
spring.datasource.username=${DB_USERNAME}      # Use Render env variable
spring.datasource.password=${DB_PASSWORD}      # Use Render env variable
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ===============================
# File Upload Directory
# ===============================
app.file.upload-dir=/tmp/uploads

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Server
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ===============================
# Mail (Disabled)
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JWT
# ===============================
app.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
app.jwt.expiration-ms=86400000

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=https://freelancer-job-market-place-spring.vercel.app

# ===============================
# Stripe Keys (Optional, can override with ENV)
# ===============================
stripe.secret-key=${STRIPE_SECRET_KEY}    # Render env variable
stripe.public-key=${STRIPE_PUBLIC_KEY}    # Render env variable

# ===============================
# Logging
# ===============================
logging.level.com.marketplace=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# ===============================
# Allow Bean Override
# ===============================
spring.main.allow-bean-definition-overriding=true
