# ===============================
# Application
# ===============================
spring.application.name=Freelance Marketplace

# ===============================
# Database Configuration - H2 (File-based for persistence)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/freelance_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access at http://localhost:8080/h2-console when running locally)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ===============================
# File Upload Directory
# ===============================
app.file.upload-dir=/tmp/uploads

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Server
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ===============================
# Mail (Disabled)
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JWT
# ===============================
app.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
app.jwt.expiration-ms=86400000

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=https://freelancer-job-market-place-spring.vercel.app

# ===============================
# Stripe Keys (Optional, can override with ENV)
# ===============================
# application.properties
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_dummy}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_dummy}

# ===============================
# Logging
# ===============================
logging.level.com.marketplace=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# ===============================
# Allow Bean Override
# ===============================
spring.main.allow-bean-definition-overriding=true