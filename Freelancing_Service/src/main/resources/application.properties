# ========================
# SERVER
# ========================
server.port=8080
server.servlet.session.timeout=30m

# ========================
# DATABASE - MySQL
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=zxcvbnm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=10000

# Enable prepared statement caching
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================
# SECURITY / JWT
# ========================
# For Development - you can change this value
app.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
# For Production - use environment variable (uncomment below and comment above for production)
# app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ========================
# CORS
# ========================
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================
# ACTUATOR / MONITORING
# ========================
# Enable all actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoints.web.exposure.exclude=

# Enable specific endpoints
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.endpoint.beans.enabled=true

# Custom health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Metrics configuration
management.metrics.tags.application=freelance-marketplace

# Application info
info.app.name=Freelance Marketplace API
info.app.description=Freelance Job Platform Backend
info.app.version=1.0.0
info.app.java.version=${java.version}
info.app.spring-boot.version=3.5.9

# ========================
# RATE LIMITING
# ========================
#rate-limiting.enabled=true
#rate-limiting.auth-limit=10
#rate-limiting.public-limit=100
#rate-limiting.secure-limit=200
#rate-limiting.time-duration-minutes=1

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# ========================
# LOGGING
# ========================
# Development logging
logging.level.com.marketplace=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=./logs/app.log
logging.file.max-size=100MB
logging.file.max-history=30

# For Production - uncomment these and comment above logging for production
# logging.level.com.marketplace=WARN
# logging.level.org.hibernate.SQL=ERROR
# logging.level.org.springframework.security=WARN
# logging.level.org.springframework.web=WARN

# ========================
# MISC
# ========================
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=dev

# Disable SpringDoc OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false